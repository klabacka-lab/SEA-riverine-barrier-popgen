---
# This is a comment
event_model_prior:
    dirichlet_process:
        parameters:
            concentration:
                value: 7.5
                estimate: false

event_time_prior:
    exponential_distribution:
        rate: 100.0

mcmc_settings:
    chain_length: 75000
    sample_frequency: 50

operator_settings:
    auto_optimize: true
    auto_optimize_delay: 1000
    operators:
        ConcentrationScaler:
            weight: 3.0
            scale: 0.1
        ModelOperator:
            weight: 10.0
            number_of_auxiliary_categories: 4
        TimeSizeRateMixer:
            weight: 5.0
            scale: 0.02
        TimeSizeRateScaler:
            weight: 0.0
            scale: 0.02
        TimeRootSizeMixer:
            weight: 3.0
            scale: 0.05
        EventTimeScaler:
            weight: 1.0
            scale: 0.02

global_comparison_settings:
    ploidy: 2
    genotypes_are_diploid: true
    markers_are_dominant: false
    population_name_delimiter: " "
    population_name_is_prefix: false
    constant_sites_removed: false
    equal_population_sizes: false
    parameters:
        population_size:
            estimate: true
            prior:
                gamma_distribution:
                    shape: 4.0
                    scale: 0.001
        root_relative_population_size:
            estimate: true
            prior:
                gamma_distribution:
                    shape: 100.0
                    scale: 0.01
                    offset: 0.0
        freq_1:
            value: 0.5
            estimate: false

        mutation_rate:
            value: 1.0
            estimate: false
    operators:
        RootPopulationSizeScaler:
            weight: 1.0
            scale: 0.05
        LeafPopulationSizeScaler:
            weight: 1.0
            scale: 0.05

comparisons:
- comparison:
    path: "../alignments/Edited_CalotesgoetziA2_and_Calotesbachae_CO1_Mekong.nex"
- comparison:
    path: "../alignments/Edited_Indotestudo_elongata_CO1_Mekong.nex"
- comparison:
    path: "../alignments/Edited_Microhylamalcomi_CO1_Mekong.nex"
- comparison:
    path: "../alignments/Edited_Trimerusuruscyanolabris_and_Trimeresuruscardamomensis_ND4_Mekong.nex"
- comparison:
    path: "../alignments/Ichthyophisbannanicus_cytb_Mekong.nex"
